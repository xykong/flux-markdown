[package]
name = "flux-telemetry"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
