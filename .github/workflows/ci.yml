name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-renderer:
    name: Docs links + renderer tests
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-renderer/package-lock.json

      - name: Check internal Markdown links
        run: bash scripts/check-links.sh

      - name: Test Feishu notification payloads
        run: node --test scripts/tests/feishu-notify.test.cjs scripts/tests/workflow-security.test.cjs

      - name: Test release failure and retry behavior
        run: python3 scripts/tests/release-publication.test.py

      - name: Install renderer dependencies
        working-directory: web-renderer
        run: npm ci

      - name: Run renderer unit tests
        working-directory: web-renderer
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Test appcast generation and reporter credits
        run: python3 scripts/tests/appcast-generation.test.py

  macos-build-test:
    name: macOS build + XCTest
    runs-on: macos-15
    env:
      CI: true
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-renderer/package-lock.json

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build web renderer
        working-directory: web-renderer
        run: |
          npm ci
          npm run build

      - name: Test production renderer in WebKit
        run: FLUX_TEST_WINDOW_POLICY=ci-foreground scripts/test-renderer-webkit.sh

      - name: Generate Xcode project
        run: |
          rm -rf FluxMarkdown.xcodeproj
          FULL_V="$(cat .version)"
          BUILD="$(echo "$FULL_V" | cut -d'.' -f3)"
          MARKETING_VERSION="$FULL_V" CURRENT_PROJECT_VERSION="$BUILD" xcodegen generate --quiet

      - name: Run Swift tests (skip benchmarks)
        run: |
          xcodebuild test \
            -project FluxMarkdown.xcodeproj \
            -scheme Markdown \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skip-testing:MarkdownTests/RenderBenchmarkTests \
            CODE_SIGNING_ALLOWED=NO
