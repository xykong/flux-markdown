name: Release build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-renderer/package-lock.json
      - run: brew install xcodegen
      - name: Verify MacPorts export transforms
        run: python3 scripts/tests/macports-export.test.py
      - name: Build renderer and generate project
        run: |
          cd web-renderer
          npm ci
          npm test -- --runInBand
          npm run build
          cd ..
          MARKETING_VERSION="$(cat .version)" CURRENT_PROJECT_VERSION="$(cut -d. -f3 .version)" xcodegen generate --quiet
      - name: Test production renderer in WebKit
        run: FLUX_TEST_WINDOW_POLICY=ci-foreground scripts/test-renderer-webkit.sh
      - name: Test macOS 11 target
        run: |
          xcodebuild test -project FluxMarkdown.xcodeproj -scheme Markdown -configuration Debug \
            -destination 'platform=macOS' -skip-testing:MarkdownTests/RenderBenchmarkTests \
            CODE_SIGN_IDENTITY=- -resultBundlePath build/native-tests.xcresult
      - name: Build universal release
        run: |
          xcodebuild build -project FluxMarkdown.xcodeproj -scheme Markdown -configuration Release \
            -destination 'generic/platform=macOS' ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/release" CODE_SIGN_IDENTITY=- -quiet
          scripts/verify-release-entitlements.sh build/release/FluxMarkdown.app
          lipo build/release/FluxMarkdown.app/Contents/MacOS/FluxMarkdown -verify_arch arm64 x86_64
      - name: Package signed bundle and provenance
        run: |
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent build/release/FluxMarkdown.app build/artifacts/FluxMarkdown.app.zip
          git rev-parse HEAD > build/artifacts/commit.txt
          cp .version build/artifacts/version.txt
          shasum -a 256 build/artifacts/FluxMarkdown.app.zip > build/artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-app
          path: build/artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-test-results
          path: build/native-tests.xcresult
          retention-days: 7
